# Mac runner actions. Project identity and data sources remain in ../os.yaml.
name: EEON
profile: ios-native
canonical_scripts:
  cleanup_note_menu: python3 scripts/prove-note-menu.py cleanup
  note_menu_diagnostics: python3 scripts/prove-note-menu.py preflight
  prepare_note_menu_runtime: python3 scripts/prove-note-menu.py watch-runtime --simulator
  e2e_note_menu_picker: python3 scripts/prove-note-menu.py picker --simulator
  e2e_note_menu_photo: python3 scripts/prove-note-menu.py photo --simulator
  e2e_note_menu: python3 scripts/prove-note-menu.py all --simulator
  e2e_note_menu_remaining: python3 scripts/prove-note-menu.py menu --simulator
  build_voice_notes: xcodebuild -project 'voice notes.xcodeproj' -scheme 'voice notes' -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build
  beta: cd ../fastlane-configs && fastlane beta app:voice-notes
  release: cd ../fastlane-configs && fastlane release app:voice-notes
mac_runner:
  ask_first: [beta, release]
  timeout_minutes: 30
